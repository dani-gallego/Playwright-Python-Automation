name: Verify Demo Web Shop secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check configuration loading
        run: python -m unittest discover -s E2E_Test -p test_config_reader.py -v

      - name: Verify injected configuration
        env:
          TEST_ENV: demoweb
          ENVIRONMENT: demoweb
          BASE_URL: https://demowebshop.tricentis.com/
          USERNAME: ${{ secrets.DEMOWEB_USERNAME }}
          PASSWORD: ${{ secrets.DEMOWEB_PASSWORD }}
        run: |
          python - <<'PY'
          from Config.EnvironmentConfig import EnvironmentConfig

          config = EnvironmentConfig()
          for name in ("environment", "base_url", "username", "password"):
              getattr(config, name)
          print("Required Demo Web Shop configuration is available.")
          PY
